[package]
name = "manifest"
version = "0.1.0"
edition = "2021"
authors = ["Griffin <griffincancode@gmail.com>"]
description = "Manifest - A sophisticated grand strategy game"
license = "MIT"
repository = "https://github.com/griffin/manifest"
rust-version = "1.77.2"

[[bin]]
name = "manifest"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Core Tauri Framework
tauri = { version = "2.0", features = [
    "devtools"
] }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Tauri Plugins
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.1"

# Database & Storage
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite"] }

# Math & Geometry
nalgebra = "0.32"
glam = "0.25"

# Profiling & Debug
tracing = "0.1"
tracing-subscriber = "0.3"

# Random Number Generation
rand = "0.8"
rand_chacha = "0.3"

# Time & Scheduling
chrono = { version = "0.4", features = ["serde"] }
