[package]
name = "manifest"
version = "0.1.0"
edition = "2021"
authors = ["Griffin <griffincancode@gmail.com>"]
description = "Manifest - A sophisticated grand strategy game"
license = "MIT"
repository = "https://github.com/GriffinCanCode/manifest"
rust-version = "1.77.2"
default-run = "manifest"

[[bin]]
name = "manifest"
path = "src/main.rs"

[[bin]]
name = "test_zig_ffi"
path = "src/bin/test_zig_ffi.rs"

[lib]
name = "manifest"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Core Tauri Framework
tauri = { version = "2.0", features = [
    "devtools"
] }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# ECS Framework
bevy_ecs = "0.12"

# Tauri Plugins
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
rmp-serde = "1.1"

# Error Handling
thiserror = "1.0"

# Database & Storage
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite"] }

# Math & Geometry
nalgebra = { version = "0.32", features = ["serde-serialize"] }
glam = { version = "0.25", features = ["serde"] }
rstar = "0.11"  # R-tree spatial indexing
ndarray = { version = "0.15", features = ["serde"] }  # Multi-dimensional arrays for chunks
num-traits = "0.2"  # Numeric traits for TileId

# ECS Storage Systems
hecs = "0.10"  # Additional sparse storage for tiles

# Data Structures
indexmap = { version = "2.2", features = ["serde"] }  # Ordered maps for adjacency graphs
arrayvec = { version = "0.7", features = ["serde"] }  # Fixed-capacity arrays
bitvec = { version = "1.0", features = ["serde"] }  # Bit vectors for ownership layers
ordered-float = { version = "4.2", features = ["serde"] }  # Hash-able float types

# Modular bitfield operations
modular-bitfield = "0.11"

# Image processing for edge detection  
image = { version = "0.24", features = ["png", "jpeg"], default-features = false }

# Profiling & Debug - Enhanced logging system
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry", "fmt"] }
tracing-appender = "0.2"
console-subscriber = { version = "0.4", optional = true }

# Random Number Generation
rand = "0.8"
rand_chacha = "0.3"

# Procedural Generation & Noise
noise = "0.8"           # Perlin, Simplex noise
bracket-noise = "0.8"   # Game-oriented noise library
voronator = "0.2"       # Voronoi diagrams
fast_poisson = "0.5"    # Poisson disk sampling
cached = "0.46"         # Proc macro for caching

# Tectonic Simulation Dependencies
delaunator = "1.0"      # Delaunay triangulation for plate generation
geo = "0.27"            # Computational geometry for boundaries
line_drawing = "1.0"    # Line drawing algorithms for mountain ranges
spade = "2.8"           # Spatial data structures for rift valleys
robust = "1.1"          # Robust geometric predicates for transform faults
rand_distr = "0.4"      # Statistical distributions for volcanic activity

# Time & Scheduling
chrono = { version = "0.4", features = ["serde"] }
spin_sleep = "1.2"
spin_sleep_util = "0.1"

# Compression for log rotation
flate2 = "1.0"
lz4_flex = "0.11"

# Simulation Dependencies
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }
speedy = { version = "0.8", features = ["chrono"] }
seahash = "4.1"
instant = "0.1"
zstd = "0.13"

# Parallel Processing
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"

# Entity Storage
slotmap = "1.0"

# Graph algorithms and hierarchies
petgraph = "0.6"

# High-performance hashing
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Caching (2025 high-performance libraries)
moka = { version = "0.12", features = ["future", "sync"] }
dashmap = "5.5"
quick_cache = "0.4"
num_cpus = "1.16"

# Hot reloading
notify = { version = "6.1", features = ["macos_kqueue"] }
libloading = "0.8"

# Lua Scripting System  
mlua = { version = "0.9", features = ["lua54", "vendored", "async", "send", "serialize"] }
toml = { version = "0.8", features = ["preserve_order"] }
ron = "0.8"
strum = { version = "0.25", features = ["derive"] }
fixedbitset = { version = "0.4", features = ["serde"] }

# Hydrological Systems Dependencies
pathfinding = "4.8"      # A* pathfinding for rivers
priority-queue = "2.0"   # Priority queues for river sources
union-find = "0.4"       # Union-find for lake detection
kdtree = "0.7"           # Spatial queries for wetlands
grid2d = "1.2.0"          # 2D grids for flow accumulation (commented out - not needed for tectonics system)

# Lazy static initialization
once_cell = "1.19"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[features]
default = []
bench = []
performance-logging = []
console-debug = ["console-subscriber"]
dev-logging = ["performance-logging", "console-debug"]
no_zig = []
speedy = []
