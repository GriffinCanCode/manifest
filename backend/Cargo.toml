[package]
name = "manifest"
version = "0.1.0"
edition = "2021"
authors = ["Griffin <griffincancode@gmail.com>"]
description = "Manifest - A sophisticated grand strategy game"
license = "MIT"
repository = "https://github.com/griffin/manifest"
rust-version = "1.77.2"

[[bin]]
name = "manifest"
path = "src/main.rs"

[lib]
name = "manifest"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Core Tauri Framework
tauri = { version = "2.0", features = [
    "devtools"
] }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# ECS Framework
bevy_ecs = "0.12"

# Tauri Plugins
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.1"

# Database & Storage
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite"] }

# Math & Geometry
nalgebra = "0.32"
glam = { version = "0.25", features = ["serde"] }
rstar = "0.11"  # R-tree spatial indexing

# Profiling & Debug - Enhanced logging system
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry", "fmt"] }
tracing-appender = "0.2"
console-subscriber = { version = "0.4", optional = true }

# Random Number Generation
rand = "0.8"
rand_chacha = "0.3"

# Time & Scheduling
chrono = { version = "0.4", features = ["serde"] }
spin_sleep = "1.2"
spin_sleep_util = "0.1"

# Deterministic Float Operations
ordered-float = { version = "4.2", features = ["serde"] }

# Compression for log rotation
flate2 = "1.0"

# Simulation Dependencies
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }
speedy = { version = "0.8", features = ["chrono"] }
seahash = "4.1"
instant = "0.1"
zstd = "0.13"

# Parallel Processing
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"

# Error handling
thiserror = "1.0"

# Entity Storage
slotmap = "1.0"

# Graph algorithms and hierarchies
petgraph = "0.6"

# High-performance hashing
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Caching (2025 high-performance libraries)
moka = { version = "0.12", features = ["future"] }
dashmap = "5.5"
quick_cache = "0.4"
num_cpus = "1.16"

# Hot reloading
notify = { version = "6.1", features = ["macos_kqueue"] }
libloading = "0.8"
mlua = { version = "0.9", features = ["lua54", "vendored", "async", "send"] }

# Lazy static initialization
once_cell = "1.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[features]
default = []
bench = []
performance-logging = []
console-debug = ["console-subscriber"]
dev-logging = ["performance-logging", "console-debug"]
no_zig = []
speedy = []
