<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manifest Full App Test</title>
  </head>
  <body>
    <div
      id="loading-screen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Arial, sans-serif;
        z-index: 9999;
      "
    >
      <h1
        style="
          margin-bottom: 20px;
          font-size: 3em;
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        "
      >
        MANIFEST
      </h1>
      <div
        style="
          width: 50px;
          height: 50px;
          border: 3px solid #ffffff40;
          border-top: 3px solid #ffffff;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "
      ></div>
      <p style="margin-top: 20px; opacity: 0.8">Testing full app loading...</p>
      <style>
        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <div id="root">Loading full app test...</div>
    <script type="module" src="/src/main-test-app.tsx"></script>
  </body>
</html>
